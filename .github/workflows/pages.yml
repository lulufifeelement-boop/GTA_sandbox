name: Publish GTA Sandbox to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare game for publishing
        run: |
          set -euo pipefail
          mkdir -p _site
          test -s game.html
          cp game.html _site/game.html
          if [ -d assets ]; then cp -R assets _site/assets; fi
          # Fetch game-ready CC0 vehicles into the same-origin Pages bundle.
          # Missing downloads are non-fatal: the game has local fallback models.
          mkdir -p _site/assets/vehicles
          fetch_glb() {
            local url="$1"
            local dest="$2"
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 "$url" -o "$dest"; then
              if [ "$(head -c 4 "$dest" || true)" != "glTF" ]; then
                echo "Warning: invalid GLB payload from $url" >&2
                rm -f "$dest"
              else
                echo "Bundled $dest ($(wc -c < "$dest") bytes)"
              fi
            else
              echo "Warning: could not download $url; fallback model will be used" >&2
              rm -f "$dest"
            fi
          }
          fetch_glb "https://grab3d.com/dl/sedan/sedan.glb" "_site/assets/vehicles/sedan.glb"
          fetch_glb "https://grab3d.com/dl/sports-car/sports-car.glb" "_site/assets/vehicles/sports-car.glb"
          fetch_glb "https://grab3d.com/dl/hatchback/hatchback.glb" "_site/assets/vehicles/hatchback.glb"
          fetch_glb "https://grab3d.com/dl/classic-car/classic-car.glb" "_site/assets/vehicles/classic-car.glb"
          fetch_glb "https://grab3d.com/dl/suv/suv.glb" "_site/assets/vehicles/suv.glb"
          fetch_glb "https://grab3d.com/dl/police-car/police-car.glb" "_site/assets/vehicles/police-car.glb"
          fetch_glb "https://grab3d.com/dl/dump-truck/dump-truck.glb" "_site/assets/vehicles/dump-truck.glb"
          fetch_glb "https://grab3d.com/dl/garbage-truck/garbage-truck.glb" "_site/assets/vehicles/garbage-truck.glb"
          cat > _site/assets/vehicles/SOURCES.txt <<'EOF'
          All vehicle GLB files in this directory are by Grab3D's Cozy Vehicles Kit, released under CC0 1.0.
          They are fetched at deploy time from https://grab3d.com/dl/<model>/<model>.glb .
          Models: sedan, sports-car, hatchback, classic-car, suv, police-car, dump-truck, garbage-truck.
          License/source pages: https://grab3d.com/models/vehicles/sedan/
          https://grab3d.com/models/vehicles/sports-car/
          https://grab3d.com/models/vehicles/hatchback/
          https://grab3d.com/models/vehicles/classic-car/
          https://grab3d.com/models/vehicles/suv/
          https://grab3d.com/models/vehicles/police-car/
          https://grab3d.com/models/vehicles/dump-truck/
          https://grab3d.com/models/vehicles/garbage-truck/
          EOF
          test -s _site/game.html
          # Extract the actual ES module and validate it with Node's ESM parser.
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('_site/game.html', 'utf8');
          const open = html.indexOf('<script type="module">');
          if (open < 0) throw new Error('No module game script found');
          const start = html.indexOf('>', open) + 1;
          const end = html.indexOf('</script>', start);
          if (start <= 0 || end < 0) throw new Error('Malformed module game script');
          fs.writeFileSync('_site/game-module-check.mjs', html.slice(start, end));
          NODE
          node --check _site/game-module-check.mjs
          rm _site/game-module-check.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const assets = fs.readdirSync('_site/assets/vehicles').filter(name => name.endsWith('.glb'));
          console.log('Bundled detailed vehicle models: ' + assets.length);
          if (assets.length < 4) console.warn('Some detailed vehicles are missing; fallback models remain available.');
          NODE
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta name="theme-color" content="#111">
            <title>Grand City Sandbox 3D</title>
          </head>
          <body style="margin:0;background:#111;color:#fff;font:16px system-ui">
            <p style="padding:24px">Открываю игру…</p>
            <script>location.replace('./game.html');</script>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
