name: Publish GTA Sandbox to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare game for publishing
        run: |
          set -euo pipefail
          mkdir -p _site
          test -s game.html
          cp game.html _site/game.html
          test -s _site/game.html
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta name="theme-color" content="#111">
            <title>Grand City Sandbox 3D</title>
          </head>
          <body style="margin:0;background:#111;color:#fff;font:16px system-ui">
            <p style="padding:24px">Открываю игру…</p>
            <script>location.replace('./game.html');</script>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
